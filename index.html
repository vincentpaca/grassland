<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GRASSLAND — a Pokemon study</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#05070d;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#cfe3ff;}
  #app{position:fixed;inset:0;}
  canvas{display:block;width:100%;height:100%;outline:none;touch-action:none;}
  #nogpu{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    color:#8fb6ff;font-size:18px;letter-spacing:1px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
  #nogpu-detail{margin-top:12px;font-size:12px;color:#5d77a0;max-width:560px;text-align:center;letter-spacing:0;word-break:break-all;}
  #loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;background:#05070d;z-index:20;transition:opacity .8s ease;}
  #loader .ttl{font-size:22px;letter-spacing:6px;color:#bcd6ff;margin-bottom:18px;}
  #loader .bar{width:280px;height:3px;background:#1a2a44;border-radius:2px;overflow:hidden;}
  #loader .bar i{display:block;height:100%;width:0;background:#6fa8ff;transition:width .4s ease;}
  #loader .sub{margin-top:14px;font-size:12px;color:#5d77a0;letter-spacing:2px;}
  #loader.hide{opacity:0;pointer-events:none;}
  #hint{position:fixed;left:14px;bottom:12px;font-size:12px;color:#6f88b8;letter-spacing:1px;
    text-shadow:0 1px 2px #000;pointer-events:none;z-index:5;}
</style>
</head>
<body>
<div id="app"></div>
<div id="nogpu">WebGPU is required. Open this in Chrome with WebGPU enabled.<div id="nogpu-detail"></div></div>
<div id="loader"><div class="ttl">GRASSLAND</div><div class="bar"><i id="fill"></i></div><div class="sub" id="lsub">BOOTING GPU…</div></div>
<div id="hint">WASD move · mouse orbit · wheel zoom · explore the meadow · F1 settings</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
