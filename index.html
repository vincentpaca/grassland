<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GRASSLAND — a Pokemon study</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#05070d;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#cfe3ff;}
  #app{position:fixed;inset:0;}
  canvas{display:block;width:100%;height:100%;outline:none;touch-action:none;}
  #nogpu{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    color:#8fb6ff;font-size:18px;letter-spacing:1px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
  #nogpu-detail{margin-top:12px;font-size:12px;color:#5d77a0;max-width:560px;text-align:center;letter-spacing:0;word-break:break-all;}
  #loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;background:#05070d;z-index:20;transition:opacity .8s ease;}
  #loader .ttl{font-size:22px;letter-spacing:6px;color:#bcd6ff;margin-bottom:18px;}
  #loader .bar{width:280px;height:3px;background:#1a2a44;border-radius:2px;overflow:hidden;}
  #loader .bar i{display:block;height:100%;width:0;background:#6fa8ff;transition:width .4s ease;}
  #loader .sub{margin-top:14px;font-size:12px;color:#5d77a0;letter-spacing:2px;}
  #loader.hide{opacity:0;pointer-events:none;}
  #hint{position:fixed;left:14px;bottom:12px;font-size:12px;color:#6f88b8;letter-spacing:1px;
    text-shadow:0 1px 2px #000;pointer-events:none;z-index:5;}
  /* ===== Mobile-only: hidden on desktop, never affects desktop layout ===== */
  #joy{position:fixed;left:24px;bottom:24px;width:120px;height:120px;border-radius:50%;
    border:2px solid rgba(111,168,255,.3);background:rgba(10,19,34,.35);
    z-index:10;display:none;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  #joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;
    border-radius:50%;background:rgba(111,168,255,.35);border:1px solid rgba(111,168,255,.5);
    pointer-events:none;transition:background .15s;}
  #joy.active i{background:rgba(111,168,255,.55);}
  #hintMobile{position:fixed;right:14px;bottom:12px;font-size:11px;color:#6f88b8;letter-spacing:1px;
    text-shadow:0 1px 2px #000;pointer-events:none;z-index:5;display:none;}
  @media (pointer:coarse) and (max-width:820px){
    #joy{display:block;}
    #hintMobile{display:block;}
    #hint{display:none;}
    #loader .ttl{font-size:18px;letter-spacing:4px;}
    #loader .bar{width:220px;}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="nogpu">Your browser doesn't support WebGPU or WebGL2.<div id="nogpu-detail"></div></div>
<div id="loader"><div class="ttl">GRASSLAND</div><div class="bar"><i id="fill"></i></div><div class="sub" id="lsub">BOOTING GPU…</div></div>
<div id="hint">WASD move · mouse orbit · wheel zoom · explore the meadow · F1 settings</div>
<div id="hintMobile">Drag to look · pinch to zoom · stick to move</div>
<div id="joy"><i></i></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
